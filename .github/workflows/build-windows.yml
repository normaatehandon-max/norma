name: Compilar CEDULA_INGRESOS.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar componentes
        run: dotnet restore CEDULA_INGRESOS.csproj

      - name: Crear ejecutable
        run: dotnet publish CEDULA_INGRESOS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false

      - name: Guardar programa
        uses: actions/upload-artifact@v4
        with:
          name: CEDULA_INGRESOS_WINDOWS
          path: bin/Release/net8.0-windows/win-x64/publish/
